name: Build and publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - gate_models.py
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements.txt

      - name: Verify release version and run regression tests
        shell: powershell
        run: |
          $gateVersion = python -c "from gate_models import APP_VERSION; print(APP_VERSION)"
          $releaseTag = "v$gateVersion"
          if ("${{ github.ref_type }}" -eq "tag" -and $releaseTag -ne "${{ github.ref_name }}") { throw "Tag does not match APP_VERSION" }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }

      - name: Build installer and portable executable
        run: .\build_windows.ps1 -SkipDependencyInstall -InnoSetupCompiler "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        shell: powershell

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          Get-ChildItem Release -Filter *.exe |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath Release\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Codex Model Gate ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          files: |
            Release/CodexModelGate-Setup.exe
            Release/CodexModelGate-Pendrive.exe
            Release/LEIA-ME-PORTATIL.md
            Release/SHA256SUMS.txt
